name: Fix Quran ayah tracking

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-quran-ayah-follow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Quran progress
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rebuild/src/screens/QuranScreen.tsx')
          s = p.read_text(encoding='utf-8')
          marker = '        {content && playableAyahs.length ? ('
          start = s.find(marker)
          if start < 0:
              raise SystemExit('Quran progress start not found')
          end_marker = '        ) : null}'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('Quran progress end not found')
          end += len(end_marker)
          old = s[start:end]
          if 'styles.progressDock' not in old:
              raise SystemExit('Unexpected Quran block; refusing unsafe patch')
          new = '''        {content && playableAyahs.length ? (
          <View pointerEvents="none" style={styles.progressDock}>
            <View style={{ marginBottom: 4, alignItems: "center" }}>
              <Text style={{ fontSize: 10, fontWeight: "700", color: colors.textMuted }}>
                {activeAyah ? `Okunan: ${activeAyah}. ayet` : "Ayet takibi hazır"}
              </Text>
            </View>
            <View style={styles.progressTrack}>
              {playableAyahs.map((ayah, index) => {
                const isPast = activeAudioIndex !== null && index < activeAudioIndex;
                const isCurrent = activeAudioIndex === index;
                const width = `${100 / playableAyahs.length}%`;
                const fillWidth = isPast
                  ? "100%"
                  : isCurrent
                    ? `${currentAudioProgress * 100}%`
                    : "0%";
                return (
                  <View key={`progress-${ayah.numberInSurah}`} style={{ width, height: 4, paddingRight: index === playableAyahs.length - 1 ? 0 : 1 }}>
                    <View
                      style={{
                        height: 4,
                        width: fillWidth,
                        borderRadius: 2,
                        backgroundColor: colors.accent,
                      }}
                    />
                  </View>
                );
              })}
            </View>
          </View>
        ) : null}'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/src/screens/QuranScreen.tsx
          git commit -m "Track Quran playback by ayah" || exit 0
          git push
