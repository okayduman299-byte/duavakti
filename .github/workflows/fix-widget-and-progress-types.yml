name: Fix widget and Quran progress type errors

on:
  push:
    paths:
      - 'rebuild/src/screens/QuranScreen.tsx'
      - 'rebuild/src/widgets/DuaVaktiWidget.tsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix TypeScript styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('rebuild/src/screens/QuranScreen.tsx')
          s = p.read_text()
          s, n = re.subn(
              r'\s*const width = `\$\{100 / playableAyahs\.length\}%`;\s*const fillWidth = isPast\s*\n\s*\? "100%"\s*\n\s*: isCurrent\s*\n\s*\? `\$\{currentAudioProgress \* 100\}%`\s*\n\s*: "0%";',
              '''\n                const fillWidth: `${number}%` = isPast\n                  ? "100%"\n                  : isCurrent\n                    ? `${currentAudioProgress * 100}%` as `${number}%`\n                    : "0%";''',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Quran progress block not found (matches={n})')
          s, n = re.subn(
              r'<View key=\{`progress-\$\{ayah\.numberInSurah\}`\} style=\{\{ width, height: 4, paddingRight: index === playableAyahs\.length - 1 \? 0 : 1 \}\}>',
              '<View key={`progress-${ayah.numberInSurah}`} style={{ flex: 1, height: 4, paddingRight: index === playableAyahs.length - 1 ? 0 : 1 }}>',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Quran progress container not found (matches={n})')
          p.write_text(s)

          p = Path('rebuild/src/widgets/DuaVaktiWidget.tsx')
          s = p.read_text()
          s = s.replace(
              '<TextWidget text={` · ${city}`} style={{ flex: 1, fontSize: 8, color: \'#8FB59D\' }} truncate="END" />',
              '<TextWidget text={` · ${city}`} style={{ width: 90, fontSize: 8, color: \'#8FB59D\' }} truncate="END" />',
              1,
          )
          p.write_text(s)
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/src/screens/QuranScreen.tsx rebuild/src/widgets/DuaVaktiWidget.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix widget and Quran progress type errors"
          git push
