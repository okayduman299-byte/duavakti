name: Fix Quran Reciter Selection

on:
  push:
    branches: [main]
    paths:
      - 'rebuild/src/screens/QuranScreenV2.tsx'
      - '.github/workflows/fix-reciter.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix reciter selection') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reciter selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rebuild/src/screens/QuranScreenV2.tsx')
          s = p.read_text()
          old = 'const r = await loadSurah(safe.number, reciter);'
          new = 'const selectedReciter = (await readJson<string>(RECITER_KEY)) || reciter;\n      const r = await loadSurah(safe.number, selectedReciter);'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rebuild/src/screens/QuranScreenV2.tsx
          git commit -m 'Fix reciter selection'
          git push
