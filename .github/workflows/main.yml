name: DuaVakti Yeni Surumu Hazirla

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu hazirla
        uses: actions/checkout@v4

      - name: Yeni DuaVakti paketini ac
        run: |
          rm -rf rebuild
          rm -rf /tmp/duavakti-rebuild
          mkdir -p rebuild
          mkdir -p /tmp/duavakti-rebuild
          unzip -q DUAVAKTI-REBUILD-v1.0.0.zip -d /tmp/duavakti-rebuild
          cp -R /tmp/duavakti-rebuild/DUAVAKTI-REBUILD/. rebuild/

      - name: Dosyalari GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild
          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni dosya yok."
            exit 0
          fi
          git commit -m "Yeni DuaVakti uygulamasini hazirla"
          git push
          
