name: DuaVakti Android APK

on:
  push:
    branches: [main]
    paths:
      - 'rebuild/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rebuild/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: rebuild
        run: npm ci

      - name: Typecheck
        working-directory: rebuild
        run: npm run typecheck

      - name: Expo prebuild
        working-directory: rebuild
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        working-directory: rebuild/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuaVakti-1.6.0-APK
          path: rebuild/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
